<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda — RIPNDRIP</title>
<meta name="description" content="Catálogo de RIPNDRIP: jeans, camisetas, buzos y accesorios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="tienda">
<a class="saltar" href="#principal">Saltar al contenido</a>

<!-- El header, el footer y el carrito lateral se generan desde js/app.js
     (función montarLayout) y aparecen igual en todas las páginas. -->
<header id="site-header" class="site-header"></header>

<main id="principal">

  <section class="pagina-cab">
    <div class="contenedor">
      <span class="etiqueta mono">CATÁLOGO</span>
      <h1 class="display">Tienda</h1>
      <p>Elige una prenda para ver su detalle, escoger talla y agregarla al carrito.</p>
    </div>
  </section>

  <section class="seccion" style="padding-top:40px">
    <div class="contenedor">
      <div class="barra">
        <div class="chips" id="filtros" role="group" aria-label="Filtrar por categoría"></div>
        <div class="barra-der">
          <span class="mono" id="cuenta" aria-live="polite"></span>
          <label class="solo-lectores" for="orden">Ordenar por</label>
          <select class="orden" id="orden">
            <option value="recientes">Orden original</option>
            <option value="menor">Precio: menor a mayor</option>
            <option value="mayor">Precio: mayor a menor</option>
          </select>
        </div>
      </div>
      <div class="grid-prod" id="grid-tienda"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<noscript><p style="padding:24px;text-align:center">Este sitio necesita JavaScript para mostrar el catálogo y el carrito.</p></noscript>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
